[project]
name = "triplemind-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is expected in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults
# on purpose; B008 would flag every route signature in the codebase.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header",
  "fastapi.Query", "fastapi.Path", "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded fake credentials in fixtures

[tool.coverage.run]
source = ["app"]
omit = ["app/observability.py"]
