# Continuous delivery: main only.
#
# Flow:  CI green -> build and push immutable images -> [manual approval]
#        -> deploy -> verify -> automatic rollback if verification fails.
#
# Images are tagged with the commit SHA and the deployment is pinned to the
# resulting digest, so "which commit is running?" has exactly one answer.
name: CD

on:
  push:
    branches: [main, master]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, production]
        default: dev

permissions:
  contents: read

concurrency:
  # Never two deploys of the same branch at once, and never cancel one
  # mid-flight -- a half-applied release is worse than a queued one.
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Scoped to this run; no long-lived registry credential exists.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Both tags point at the same digest: the SHA tag is the traceable
          # one, `latest` is a convenience that CD never deploys from.
          tags: |
            ghcr.io/${{ github.repository_owner }}/triplemind-backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/triplemind-backend:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/triplemind-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/triplemind-frontend:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Record what was published
        run: |
          {
            echo "### Published images"
            echo ""
            echo "| component | tag | digest |"
            echo "|---|---|---|"
            echo "| backend | \`${{ steps.meta.outputs.version }}\` | \`${{ steps.backend.outputs.digest }}\` |"
            echo "| frontend | \`${{ steps.meta.outputs.version }}\` | \`${{ steps.frontend.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    needs: build-push
    # The approval gate. A GitHub Environment with required reviewers pauses
    # the run here; the deploy step cannot start until a human approves.
    # Automation does everything that is reversible and cheap to redo; a
    # person owns the one step that changes what users see.
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: https://triplemind.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # This project's target cluster is a local kind cluster, which a hosted
      # runner cannot reach. The deploy is therefore performed against an
      # ephemeral kind cluster created here, using the identical chart, values
      # and digests that a real cluster would receive. To point this at a real
      # cluster, replace this step with a kubeconfig from secrets -- nothing
      # below it changes.
      - uses: helm/kind-action@v1
        with:
          config: deploy/kind/cluster.yaml
          cluster_name: triplemind

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s

      - name: Pull the published images onto the node
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BE="ghcr.io/$OWNER/triplemind-backend@${{ needs.build-push.outputs.backend-digest }}"
          FE="ghcr.io/$OWNER/triplemind-frontend@${{ needs.build-push.outputs.frontend-digest }}"
          docker pull "$BE"
          docker pull "$FE"
          docker tag "$BE" triplemind-backend:${{ needs.build-push.outputs.version }}
          docker tag "$FE" triplemind-frontend:${{ needs.build-push.outputs.version }}
          kind load docker-image \
            triplemind-backend:${{ needs.build-push.outputs.version }} \
            triplemind-frontend:${{ needs.build-push.outputs.version }} --name triplemind

      - name: Deploy
        run: |
          helm upgrade --install triplemind deploy/helm/triplemind \
            -n triplemind --create-namespace \
            -f deploy/helm/triplemind/values-dev.yaml \
            --set global.appVersion=${{ needs.build-push.outputs.version }} \
            --set backend.image.tag=${{ needs.build-push.outputs.version }} \
            --set frontend.image.tag=${{ needs.build-push.outputs.version }} \
            --set monitoring.serviceMonitor.enabled=false \
            --set monitoring.prometheusRule.enabled=false \
            --wait --timeout 5m

      - name: Verify the release
        id: verify
        run: |
          helm test triplemind -n triplemind --logs
          ./scripts/verify-version.sh triplemind ${{ needs.build-push.outputs.version }}
          ./scripts/smoke.sh http://triplemind.localtest.me:8081

      # Recovery is part of the pipeline, not a manual afterthought: if
      # verification fails, the previous revision is restored immediately and
      # the run is still marked failed so someone investigates.
      - name: Roll back on failed verification
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          echo "::error::Verification failed -- rolling back"
          helm rollback triplemind -n triplemind --wait --timeout 5m
          helm history triplemind -n triplemind

      - name: Release summary
        if: always()
        run: |
          {
            echo "### Release"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- version: \`${{ needs.build-push.outputs.version }}\`"
            echo "- backend digest: \`${{ needs.build-push.outputs.backend-digest }}\`"
            echo ""
            helm history triplemind -n triplemind || true
          } >> "$GITHUB_STEP_SUMMARY"
