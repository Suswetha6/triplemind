apiVersion: 1

providers:
  - name: triplemind
    orgId: 1
    folder: TripleMind
    type: file
    disableDeletion: false
    # Dashboards are files in git, not clicked-together state in Grafana's
    # database -- so they survive a container restart and show up in diffs.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
