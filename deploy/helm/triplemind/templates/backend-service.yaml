apiVersion: v1
kind: Service
metadata:
  name: {{ include "triplemind.backendFullname" . }}
  labels: {{- include "triplemind.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  # ClusterIP: the backend is never exposed outside the cluster. All browser
  # traffic arrives through the Ingress -> frontend nginx -> this Service.
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "triplemind.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
