apiVersion: v1
kind: Service
metadata:
  name: {{ include "triplemind.frontendFullname" . }}
  labels: {{- include "triplemind.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "triplemind.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
