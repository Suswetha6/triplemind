{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "triplemind.serviceAccountName" . }}
  labels: {{- include "triplemind.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither component talks to the Kubernetes API, so no token is projected
# into the pods and no Role/RoleBinding is granted. Least privilege by
# omission rather than by policy.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
