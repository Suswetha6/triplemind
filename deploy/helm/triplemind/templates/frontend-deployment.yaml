apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "triplemind.frontendFullname" . }}
  labels: {{- include "triplemind.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "triplemind.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "triplemind.componentLabels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "triplemind.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
        # emptyDir volumes are created root-owned; fsGroup is what makes them
        # writable by the unprivileged nginx uid.
        fsGroup: 101
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "triplemind.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: {{ include "triplemind.image" (dict "image" .Values.frontend.image "defaultTag" (.Values.global.appVersion | default .Chart.AppVersion)) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Points nginx's /api proxy at the backend Service. Rendered from
            # the chart, so the two components can never drift apart.
            - name: BACKEND_UPSTREAM
              value: {{ printf "%s:%v" (include "triplemind.backendFullname" .) .Values.backend.service.port | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.frontend.probes.liveness.failureThreshold }}
          readinessProbe:
            # Served by nginx itself, not proxied to the backend: a backend
            # outage must not also take the static frontend out of rotation.
            httpGet:
              path: {{ .Values.frontend.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.frontend.probes.readiness.failureThreshold }}
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # nginx renders its config and writes its pid/caches at startup;
            # these three mounts are what allow the root filesystem to be
            # read-only.
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
