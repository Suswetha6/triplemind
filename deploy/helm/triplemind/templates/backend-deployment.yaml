apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "triplemind.backendFullname" . }}
  labels: {{- include "triplemind.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  # A Deployment, not a StatefulSet: the backend holds no state between
  # requests (session data lives in the browser), so pods are interchangeable
  # and need neither stable identity nor persistent volumes.
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current capacity during a rollout; add one pod,
      # wait for it to pass readiness, then retire an old one.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "triplemind.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "triplemind.componentLabels" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        # Roll the pods when configuration changes, so a ConfigMap edit is a
        # real release rather than silent drift against a running pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-backend.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.backend.service.port | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "triplemind.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      # Give the scheduler a reason to spread replicas; on a single-node kind
      # cluster this degrades gracefully to "best effort".
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "triplemind.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 14 }}
      # Long enough for in-flight SSE streams to finish before SIGKILL.
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          image: {{ include "triplemind.image" (dict "image" .Values.backend.image "defaultTag" (.Values.global.appVersion | default .Chart.AppVersion)) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "triplemind.backendFullname" . }}
            {{- if .Values.backend.existingSecret }}
            - secretRef:
                name: {{ .Values.backend.existingSecret }}
            {{- end }}
          env:
            - name: TM_VERSION
              value: {{ .Values.global.appVersion | default .Chart.AppVersion | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so the one writable path is an
            # explicit ephemeral volume.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.backend.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
