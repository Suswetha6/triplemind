# Single-node kind cluster used for local verification and CI.
#
# Node ports 80/443 are mapped to the host so the ingress-nginx controller is
# reachable at http://triplemind.localtest.me (localtest.me resolves to
# 127.0.0.1, so no /etc/hosts edit is needed).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: triplemind
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
