# Main nginx config, replacing the base image's.
#
# Two constraints shape it: the process runs as an unprivileged uid (101), and
# the container filesystem is read-only in both Compose and Kubernetes. So the
# pid file, caches and the rendered server block all live under /tmp, which is
# the one writable mount.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Every writable path relocated under /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Preserve a caller-supplied correlation id, generate one otherwise, so a
    # request can be followed from the browser through nginx into the backend
    # logs and traces.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Structured access log, matching the backend's JSON shape so both
    # services can be queried the same way.
    log_format json_combined escape=json
      '{'
        '"ts":"$time_iso8601",'
        '"level":"INFO",'
        '"logger":"nginx.access",'
        '"service":"triplemind-frontend",'
        '"request_id":"$req_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"duration_s":$request_time,'
        '"bytes":$body_bytes_sent,'
        '"client_ip":"$remote_addr",'
        '"upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent"'
      '}';

    # The server block is rendered here by the envsubst entrypoint at startup
    # (see 10-prepare-conf-dir.sh), because /etc/nginx is read-only at runtime.
    include /tmp/nginx-conf/*.conf;
}
